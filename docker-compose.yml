services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: clinicore-frontend
    restart: unless-stopped
    ports:
      - "3001:3000" # <-- Mapea el puerto 3001 de tu PC al 3000 interno del contenedor
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"